<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma liste de films</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🎬 Ma liste de films</h1>
    <p id="counter"></p>

    <form id="movie-form">
      <input type="text" id="title-input" placeholder="Titre du film" required>
      <select id="genre-select">
        <option value="Action">Action</option>
        <option value="Animation">Animation</option>
        <option value="Comédie">Comédie</option>
        <option value="Drame">Drame</option>
        <option value="Science-fiction">Science-fiction</option>
      </select>
      <button type="submit">Ajouter</button>
    </form>

    <div class="filters">
      <input type="search" id="search-input" placeholder="Rechercher un film…">
      <select id="genre-filter">
        <option value="tous">Tous les genres</option>
        <option value="Action">Action</option>
        <option value="Animation">Animation</option>
        <option value="Comédie">Comédie</option>
        <option value="Drame">Drame</option>
        <option value="Science-fiction">Science-fiction</option>
      </select>
    </div>

    <ul id="movie-list"></ul>
    <p id="hover-info"></p>
  </main>

  <script src="js/view.js" type="module"></script>
</body>
</html>
